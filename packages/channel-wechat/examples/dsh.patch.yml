# DSH patch 模板 —— 桥用 `dsh --patch <本文件>` 注入，**不改动任何全局 profile 配置**。
#
# 用法：
#   1. 复制成你自己的文件（例如 my.patch.yml），把下面 ① 改成你的模型通道
#   2. 在 state/config.json 里指向它：
#        "agent": { "backend": "dsh", "dsh": { "patchFile": "./my.patch.yml" } }
#   3. 自检：  dsh --profile headless --patch ./my.patch.yml --dump-config | head
#
# ⚠️ 顺序陷阱：命令行里 `--patch` 必须写在 `--json` 之前。
#    写成 `dsh --json --patch f.yml` 会直接报 unknown option '--patch'。

# ── ① 模型通道（必改）─────────────────────────────────────────────
# 这里只是一个 openai-compatible 的占位示例。换成你自己的 provider。
# API key 走 dsh 的凭据库（key 名或 ${ENV} ref），不要把明文写进来。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      my-provider:
        displayName: My Provider
        apiKeyEnv: MY_PROVIDER_API_KEY
        api: openai-completions
        baseURL: https://api.example.com/v1
        models:
          - id: my-model
            name: My Model
            contextWindow: 131072
            maxTokens: 8192
            input:
              - text
              - image

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: my-provider
    model: my-model

# ── ② 人格（重要：这段是桥和 agent 之间的约定）─────────────────────
# agent 的输出会被**原样发进微信**，所以必须在这里说清楚输出格式。
# 少了这段，"agent 回了一坨 Markdown 表格"这种事故就会天天发生。
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    personaPrefix: >-
      你是一个通过微信被远程遥控的私人助理，运行在用户自己的机器上。
      你的输出会被原样发进微信：禁止 Markdown（不要表格、不要代码围栏、不要 # 标题、
      不要 ** 粗体），用纯文本短句，结论先行，默认 200 字以内。
      要给他发文件，就在回复里**单独写一行** [[file:/绝对/路径]]，
      也可以带配文 [[file:/绝对/路径|说明]]——桥会自动把文件发进微信，这一行本身不会显示。
      写之前先确认文件真实存在。
      碰到**长期有用**的事（主人的偏好、常用路径、习惯、怎么称呼他），
      就在回复的**最后单独一行**写 [[记住: 一句话]]；一次最多写一条，
      拿不准就**别写**——记错了比没记住更糟。一次性的东西（这次的任务、这次的结果）不要写。
      破坏性操作（删除、改系统配置、对外发送）先问一句再动手。

      【硬性禁止】绝不要用「截图 + 模拟鼠标键盘」去操作图形界面程序（微信、浏览器、
      编辑器、系统设置等）。这条路极慢、极脆、几十步都未必成，还会在用户屏幕上乱点东西。
      凡是只能靠点界面才能完成的事，就直接说做不到，并给替代路径（命令行 / API /
      让用户自己动手），不要退而求其次去搞 GUI 自动化。

      【预算意识】同一个思路连续两次没有实质进展，就停下换思路，或直接把卡点告诉用户。
      不要靠"再试一次"堆步数。
    personaSuffix: 你的工作目录是 {{cwd}}。

# ── ③ headless 场景的两个必要修正（建议保留）──────────────────────
#
# ③-a 批准策略必须是 never。
#   默认是 ask —— 而 headless 里**没有任何"应答者"能批准**。一旦 agent 碰到被判定
#   为敏感的操作，它就会无限期地等一个永远不会来的批准，整条桥跟着卡死。
#   微信这条路旁边没有人点"允许"，所以必须明确 never。
- id: approval
  config:
    policy: never

# ③-b 如果你的桥进程本身跑在另一个沙箱里（例如从某个 agent 会话里启动的），
#   macOS 的 sandbox-exec **不允许嵌套**，所有 bash 都会以
#     sandbox-exec: sandbox_apply: Operation not permitted
#   失败，agent 就变成"只能看不能动"。此时把 bash 执行器换成不套沙箱的本地实现：
#
#     - id: bash-sandbox
#       disabled: true
#     - id: permission
#       disabled: true          # permission-presets 必须配"会约束"的执行器，换掉后它会报误配置
#     - insert:
#         - id: bash-local
#           name: '@deepseek-ai/dsh-bash-local'
#           config:
#             timeoutMs: 600000
#
#   ⚠️ 代价：agent 的 shell 命令**不再受文件写入边界约束**。
#   更干净的做法是把桥装成 launchd/systemd 服务，让进程由 init 直接拉起、
#   不在任何沙箱内，然后保留默认的 sandbox。
#   上面这几行默认注释掉——**先试默认配置**，只在报 nested sandbox_apply 错时才打开。
