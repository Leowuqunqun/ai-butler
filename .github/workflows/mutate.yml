name: 变异体检

# 本仓有一套"变异体检"：`pnpm mutate` 会把每个**变异点**改坏，看**测试有没有喊疼**。
# 它的输出只有一句话是重点 ——「砸了 N 处：N 处见血，0 处没被任何测试盯住」。
#
# 为什么不放进 `ci.yml`（⚠️ 理由不是"它慢到不能忍"，第 68 轮实测过：这里 ~8 分钟、
# `ci.yml` ~2 分钟，只差 4 倍 —— 我原来写的"慢一个量级"是夸大了）：两件事。
#   ① `ci.yml` 是 **3 个 Node 版本的矩阵**，而变异结论跟 Node 版本无关 —— 放进去等于同样的活
#      白跑 3 遍；
#   ② 它测的是"**断言还咬不咬得住**"，那是**周**级别的性质（只有产品代码或测试变了它才可能变），
#      不需要卡在每条提交的必经之路上；万一它自己抖一下，也不该挡住无关的改动。
#
# ⚠️ 但它**不是可选装饰**：`pnpm mutate` 在没有变异点"逃脱"时才退 0（见 scripts/mutate.mjs
#    的退出码约定：0 全部见血 / 1 有绿掉的 / 2 --only 没匹配上 / 3 原仓变异点被改动过）。
#    所以这个 job 红了就是**真的有断言失灵**，跑一次本地 `pnpm mutate` 能看到是哪一条。

on:
  schedule:
    # ⚠️ 故意不写整点：GitHub 自己的文档就说整点是高峰、可能被推迟甚至丢。
    #    每周日 03:17 UTC（北京时间 11:17）—— 开源仓的定时任务不花额度，但也没必要凑热闹。
    #
    # ⚠️ 另一个已知的坑（不是本仓能控制的）：GitHub 会把**长期没有活动**的仓库的定时任务**停用**，
    #    社区里为此专门有 keepalive 这类 action（https://github.com/marketplace/actions/keepalive-workflow）。
    #    本仓在持续提交，碰不上；但万一哪周发现它没跑，先去 Actions 页面看它是不是被停了 ——
    #    下面那条 workflow_dispatch 不受影响，随时能手动跑。
    - cron: '17 3 * * 0'
  # 手动触发（合并进来的当天想先看一眼，不必等到周日）
  workflow_dispatch:

permissions:
  contents: read

# 上一轮还没跑完就不要再叠一轮（每周一次几乎不会撞上，但手动触发有可能）
concurrency:
  group: mutate
  cancel-in-progress: false

jobs:
  mutate:
    runs-on: ubuntu-latest
    # 实测：ubuntu runner 上 7 分 48 秒（2026-10-14 那次 02:13:26 → 02:21:14，结论
    # 「砸了 74 处：74 处见血，0 处没被任何测试盯住」、保险 2 ✅、退 0）。
    # 30 分钟 ≈ 4 倍余量；真卡住了就让这一步**红着超时**，而不是挂在那儿占着 runner、
    # 还让人以为"还在跑"。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 跟 ci.yml 同一个道理：本仓 package.json 里有 packageManager 字段，
      # 这里**故意不写** version，让它装锁文件对应的那个确切版本。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 只跑一个版本：这里验的是"断言咬不咬得住"，那是**行为**性质，
          # 跟 Node 小版本基本无关（跨版本那条轴 ci.yml 已经在跑了）。
          # 选 24 是为了跟本地那份证据同版本，好对账。
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # ⚠️ 必须构建：变异点分成两类，走 e2e 的那几条要有 lib/ 才能跑得起来
      #    （演练脚本第一句就是 [ -f "${CLI}" ] || bad "找不到 CLI"）。
      - name: 构建（TypeScript 包 → lib/）
        run: pnpm build

      - name: 变异体检（逐条改坏 / 看测试喊不喊疼；0 处"没被任何测试盯住"才算过）
        run: pnpm mutate
